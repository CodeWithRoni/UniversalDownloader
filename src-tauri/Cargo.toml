[package]
name = "universal-downloader"
version = "2.0.0"
description = "Universal Downloader — fast video & audio downloader"
authors = ["Md. Amzad Hossain Roni"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
# staticlib/cdylib are needed for the iOS and Android builds.
name = "universal_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "fs", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
futures-util = "0.3"
regex = "1"
# Pure-Rust YouTube engine. Always used on Android/iOS (no yt-dlp there);
# on desktop it is only compiled with `--features native-engine` (for testing).
rusty_ytdl = { version = "0.7.4", default-features = false, features = ["search", "rustls-tls"], optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rusty_ytdl = { version = "0.7.4", default-features = false, features = ["search", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
native-engine = ["dep:rusty_ytdl"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
