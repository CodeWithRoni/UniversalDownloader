<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#5b5bf6"/>
      <stop offset="1" stop-color="#2f80ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e8ff"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#shine)"/>
  <!-- play badge -->
  <path d="M430 250 L430 430 L586 340 Z" fill="#ffffff" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.9" stroke-width="24" stroke-linejoin="round"/>
  <!-- download arrow -->
  <path d="M512 470 L512 700" stroke="url(#arrow)" stroke-width="84" stroke-linecap="round"/>
  <path d="M392 600 L512 720 L632 600" fill="none" stroke="url(#arrow)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tray -->
  <path d="M300 690 L300 760 Q300 800 340 800 L684 800 Q724 800 724 760 L724 690" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
